{% extends 'base.html' %}
{% block title %}Sign Up{% endblock title %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        
        <!-- Uses your custom .card class from style.css -->
        <div class="card text-center">
            <h2 class="mb-4">Create New Account</h2>

            {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
            {% endif %}

            <!-- text-start keeps labels and inputs aligned to the left -->
            <form method="POST" class="text-start" id="signupForm">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="first_name" class="form-label fw-semibold">First Name</label>
                    <input type="text" class="form-control" id="first_name" name="first_name" placeholder="Enter your first name" required>
                </div>

                <div class="mb-3">
                    <label for="last_name" class="form-label fw-semibold">Last Name</label>
                    <input type="text" class="form-control" id="last_name" name="last_name" placeholder="Enter your last name" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Username</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Choose a username" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Create a password" required>
                </div>

                <!-- Confirm Password Field -->
                <div class="mb-3">
                    <label for="confirm_password" class="form-label fw-semibold">Confirm Password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>
                </div>

                <!-- Uses your custom .btn class for the blue gradient -->
                <button type="submit" class="btn">Create Account</button>
            </form>

            <p class="mt-4 mb-0">
                Already have an account? 
                <a href="{% url 'login' %}" class="fw-semibold text-decoration-none" style="color: #2563eb;">Login here</a>
            </p>
        </div>

    </div>
</div>
{% endblock content %}
